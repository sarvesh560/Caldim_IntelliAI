# Optional Docker Compose for PostgreSQL in Phase 2
# Note: Docker is NOT required if you use the native Windows PostgreSQL 18 service.

services:
  postgres:
    image: postgres:18-alpine
    container_name: caldim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caldim_intellisolve}
      POSTGRES_USER: ${POSTGRES_USER:-caldim_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_securely}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
